<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fff9f1" />
    <title>English Adventure</title>
  <style>
:root {
  --background: #fff9f1;
  --surface: #fff;
  --text: #263238;
  --muted: #66767a;
  --primary: #367c7c;
  --primary-soft: #dcf0ee;
  --accent: #de812d;
  --accent-soft: #fff0df;
  --success: #478a59;
  --success-soft: #e5f4e8;
  --highlight: #ffd966;
  --danger: #9a6226;
  --line: #e8dfd3;
  --font: Nunito, "Arial Rounded MT Bold", "Arial Rounded MT", system-ui, sans-serif;
  --radius-card: 24px;
  --radius-button: 16px;
  --space-xs: 8px;
  --space-sm: 14px;
  --space-md: 22px;
  --space-lg: 34px;
  --shadow-card: 0 14px 32px rgba(58, 48, 35, .1);
  --transition-fast: 180ms ease;
  --activity-heading-size: clamp(2rem, 4.3vw, 3.35rem);
  --activity-prompt-size: clamp(1.55rem, 3.25vw, 2.15rem);
}

* { box-sizing: border-box; }
html, body { min-height: 100%; max-width: 100%; }
body { margin: 0; overflow-x: hidden; background: var(--background); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
button { border: 0; color: inherit; cursor: pointer; font: inherit; }
button:focus-visible { outline: 4px solid #1f6677; outline-offset: 4px; }
button:disabled { cursor: not-allowed; opacity: .48; transform: none !important; }
[hidden] { display: none !important; }
h1, h2, h3, p { margin-top: 0; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; } }

.app { min-height: 100vh; min-height: 100dvh; }
.home { min-height: 100vh; min-height: 100dvh; padding: clamp(32px, 7vw, 88px) clamp(20px, 7vw, 112px); background: radial-gradient(circle at 12% 10%, #ffe2ba 0 5.5%, transparent 5.7%), radial-gradient(circle at 88% 13%, #d8efec 0 6.2%, transparent 6.4%), var(--background); }
.brand { margin: 0 0 clamp(35px, 7vw, 76px); font-size: clamp(2rem, 5.4vw, 4.2rem); font-weight: 900; letter-spacing: -.055em; }
.lesson-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(16px, 2.5vw, 30px); max-width: 1280px; }
.player { min-height: 100vh; min-height: 100dvh; display: grid; grid-template-rows: minmax(78px, 10vh) minmax(0, 1fr) minmax(86px, 10vh); padding: 0 clamp(16px, 4vw, 62px); }
.topbar, .bottom-controls { display: flex; align-items: center; justify-content: space-between; gap: var(--space-sm); }
.topbar { border-bottom: 1px solid var(--line); }
.bottom-controls { border-top: 1px solid var(--line); }
.lesson-title { flex: 1; min-width: 0; text-align: center; font-size: clamp(1.12rem, 2.4vw, 1.5rem); font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; user-select: none; }
.stage { display: grid; place-items: center; min-height: 0; padding: clamp(18px, 3vw, 42px) 0; }
.bottom-center { flex: 1; display: flex; justify-content: center; }

@media (max-width: 900px) {
  .lesson-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

/* Mobile foundation: one viewport, one content scroller, safe-area aware controls. */
@media (max-width: 600px) {
  .app { width: 100%; min-width: 0; overflow-x: clip; }
  .home {
    padding: calc(28px + env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) calc(30px + env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
  }
  .brand { margin-bottom: 28px; font-size: clamp(2.15rem, 11vw, 2.9rem); line-height: 1; }
  .lesson-grid { grid-template-columns: 1fr; gap: 16px; }

  .player {
    width: 100%;
    height: 100vh;
    height: 100dvh;
    min-height: 0;
    overflow: hidden;
    grid-template-rows:
      calc(64px + env(safe-area-inset-top))
      minmax(0, 1fr)
      calc(72px + env(safe-area-inset-bottom));
    padding-right: max(12px, env(safe-area-inset-right));
    padding-left: max(12px, env(safe-area-inset-left));
  }

  .topbar {
    min-width: 0;
    gap: 8px;
    padding-top: env(safe-area-inset-top);
  }
  .bottom-controls {
    gap: 10px;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .lesson-title {
    font-size: clamp(.95rem, 4.2vw, 1.1rem);
    line-height: 1.15;
  }
  .stage {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    min-width: 0;
    min-height: 0;
    overflow-x: hidden;
    overflow-y: auto;
    overscroll-behavior-y: contain;
    -webkit-overflow-scrolling: touch;
    padding: 14px 0 20px;
    scroll-padding: 14px 0 20px;
  }
  .stage > .activity-card { margin-top: auto; margin-bottom: auto; flex: 0 0 auto; }
  .bottom-center { display: flex; min-width: 0; }
}

/* Primary portrait target: iPhone 16 class screens (roughly 375-430 CSS px wide). */
@media (max-width: 600px) and (orientation: portrait) {
  .stage { padding-top: 12px; }
}

/* Final responsive pass --------------------------------------------------
   Portrait phones use one vertical scroller. Short landscape phones get a
   dedicated compact shell instead of inheriting desktop geometry. */
@media (max-width: 600px) {
  .stage {
    scrollbar-width: none;
    padding: 10px 0 16px;
  }
  .stage::-webkit-scrollbar { display: none; }
}

@media (orientation: landscape) and (max-height: 500px) {
  .app { width: 100%; min-width: 0; overflow: hidden; }
  .player {
    width: 100%;
    height: 100vh;
    height: 100dvh;
    min-height: 0;
    overflow: hidden;
    grid-template-rows:
      calc(50px + env(safe-area-inset-top))
      minmax(0, 1fr)
      calc(56px + env(safe-area-inset-bottom));
    padding-right: max(8px, env(safe-area-inset-right));
    padding-left: max(8px, env(safe-area-inset-left));
  }
  .topbar {
    min-width: 0;
    gap: 7px;
    padding-top: env(safe-area-inset-top);
  }
  .bottom-controls {
    gap: 8px;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .lesson-title {
    font-size: .96rem;
    line-height: 1.1;
  }
  .stage {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    min-width: 0;
    min-height: 0;
    overflow-x: hidden;
    overflow-y: auto;
    overscroll-behavior-y: contain;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding: 7px 0 9px;
  }
  .stage::-webkit-scrollbar { display: none; }
  .stage > .activity-card {
    flex: 0 0 auto;
    margin-top: auto;
    margin-bottom: auto;
  }
  .bottom-center { display: flex; min-width: 0; }

  .home {
    min-height: 100vh;
    min-height: 100dvh;
    padding: calc(18px + env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
  }
  .brand { margin-bottom: 16px; font-size: clamp(2rem, 7vw, 2.75rem); }
  .lesson-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; max-width: 820px; }
}

.lesson-card { position: relative; display: flex; min-height: 230px; flex-direction: column; align-items: flex-start; justify-content: space-between; padding: 26px; border-radius: var(--radius-card); background: var(--surface); box-shadow: var(--shadow-card); text-align: left; transition: transform var(--transition-fast), box-shadow var(--transition-fast); }
.lesson-card:not(:disabled):hover { transform: translateY(-5px); box-shadow: 0 19px 38px rgba(58,48,35,.14); }
.lesson-card:active:not(:disabled) { transform: translateY(-1px) scale(.99); }
.lesson-card.locked { background: #f7f4ee; color: #8c9798; box-shadow: none; }.lesson-card.completed { border: 2px solid #b7ddc0; }
.lesson-icon { font-size: 4.3rem; line-height: 1; }
.lesson-label { font-size: 1.04rem; font-weight: 900; }
.lesson-name { font-size: clamp(1.55rem, 2.4vw, 2rem); font-weight: 900; letter-spacing: -.03em; }
.status { padding: 6px 11px; border-radius: 999px; background: var(--primary-soft); color: #1f6262; font-size: .8rem; font-weight: 900; }
.locked .status { background: #e7e5df; color: #737c7d; }.completed .status { background: var(--success-soft); color: #357244; }
.icon-button, .nav-button, .replay-button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-width: 56px; min-height: 56px; padding: 12px 16px; border: 1px solid var(--line); border-radius: var(--radius-button); background: var(--surface); font-weight: 900; transition: transform var(--transition-fast), background var(--transition-fast); }
.nav-button { min-width: 135px; }.nav-button.next { border-color: var(--primary); background: var(--primary); color: #fff; }.icon-button:hover, .nav-button:hover, .replay-button:hover { transform: translateY(-2px); }
.activity-card { width: min(920px, 100%); max-height: 100%; overflow: auto; padding: clamp(25px, 4vw, 50px); border: 1px solid #eee5d9; border-radius: var(--radius-card); background: var(--surface); box-shadow: var(--shadow-card); text-align: center; animation: fade-in 260ms ease; }
.activity-type { margin-bottom: 10px; color: var(--primary); font-size: .9rem; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; }.activity-heading { margin-bottom: 22px; font-size: var(--activity-heading-size); line-height: 1.1; letter-spacing: -.05em; }.instruction { max-width: 630px; margin: -8px auto 24px; color: var(--muted); font-size: clamp(1.05rem, 2.1vw, 1.25rem); }.teaching-visual { display: block; object-fit: contain; animation: none !important; }.teaching-visual--hero.character { width: min(270px, 64vw); aspect-ratio: 1; margin: 0 auto 25px; border-radius: 31px; background: var(--accent-soft); }.teaching-visual--unavailable { display: grid; place-items: center; width: 150px; height: 120px; margin: 12px auto; padding: 12px; border: 3px dashed var(--danger); border-radius: 16px; background: #fff8ed; color: #9c4129; font-size: .85rem; font-weight: 900; text-align: center; }
.replay-button { background: var(--primary-soft); border: 0; color: #1f5b5b; }.speaker { font-size: 1.45rem; }.choice-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(14px, 2.5vw, 24px); max-width: 780px; margin: 26px auto 0; }.choice { display: flex; min-height: clamp(150px, 24vw, 205px); flex-direction: column; align-items: center; justify-content: center; gap: 9px; padding: 12px; border: 3px solid var(--line); border-radius: 22px; background: #fff; font-size: clamp(1.05rem, 2vw, 1.25rem); font-weight: 900; transition: transform var(--transition-fast), border-color var(--transition-fast), background var(--transition-fast); }.choice:hover { border-color: #94c6c4; background: #fbfffe; }.choice-visual { width: clamp(94px, 15vw, 136px); height: clamp(94px, 15vw, 136px); }.choice.correct { border-color: var(--success); background: var(--success-soft); }.choice.incorrect { border-color: var(--danger); background: #fff8ed; }.feedback { min-height: 28px; margin: 16px 0 0; font-weight: 900; }.feedback.correct { color: var(--success); }.feedback.incorrect { color: var(--danger); }
.listen-orb { display: grid; place-items: center; width: min(130px, 30vw); aspect-ratio: 1; margin: 0 auto 24px; border-radius: 50%; background: var(--primary-soft); color: #205c5c; font-size: 4rem; }.listen-orb:active { transform: scale(.95); }
.drag-object { display: grid; place-items: center; width: 118px; height: 118px; margin: 18px auto; border: 3px dashed #d69a55; border-radius: 24px; background: #fff9ef; touch-action: none; user-select: none; }.teaching-visual--drag { width: 96px; height: 96px; }.drop-target { display: grid; place-items: center; min-height: 180px; max-width: 600px; margin: 0 auto; border: 3px dashed #91c2bf; border-radius: 24px; background: #f5fbfa; color: #36595c; font-size: 1.25rem; font-weight: 900; }.drop-target.over { border-color: var(--primary); background: var(--primary-soft); }.target-label { margin-top: 14px; }.target-visual { width: 135px; height: 105px; }.placed-visual { width: 72px; height: 72px; margin-top: -52px; z-index: 1; }
.speak-turn { margin: 20px 0; color: var(--accent); font-size: clamp(1.1rem, 2.5vw, 1.45rem); font-weight: 1000; letter-spacing: .12em; }.speak-question { max-width: 650px; margin: 0 auto 18px; padding: 24px; border-radius: 22px; background: var(--accent-soft); font-size: var(--activity-prompt-size); line-height: 1.2; font-weight: 900; }.speak-complete { margin: 12px 0 0; background: var(--success-soft); color: #357244; }.action-prompt { max-width: 560px; margin: -4px auto 22px; color: var(--muted); font-size: clamp(1.1rem, 2.4vw, 1.35rem); font-weight: 800; }.action-complete { margin: 12px 0 0; background: var(--success-soft); color: #357244; }.review-list { display: grid; gap: 12px; max-width: 700px; margin: 0 auto; }.review-item { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 15px; min-height: 73px; padding: 12px 19px; border: 2px solid var(--line); border-radius: 17px; background: #fff; text-align: left; font-weight: 900; }.review-item.done { border-color: var(--success); background: var(--success-soft); }.review-visual { width: 56px; height: 48px; }.challenge-count { margin: -13px 0 18px; color: var(--muted); font-weight: 800; }.challenge-stage .activity-card { width: 100%; max-height: none; padding: 0; border: 0; box-shadow: none; animation: none; }.challenge-stage .activity-heading { font-size: var(--activity-heading-size); }.challenge-next { margin-top: 22px; }.renderer-error { padding: 24px; border-radius: 18px; background: #fff8ed; color: #9c4129; font-weight: 900; }
.drop-area.correct { border-color: var(--success); background: var(--success-soft); }.progress-dots { display: flex; gap: 5px; }.progress-dot { display: block; width: 9px; height: 9px; border-radius: 50%; background: #e8dfd3; }.progress-dot.done { background: var(--primary); }.finish { min-height: 100vh; display: grid; place-items: center; padding: 28px; }.finish-card { width: min(650px,100%); padding: clamp(38px,7vw,72px); border-radius: 32px; background: var(--surface); box-shadow: var(--shadow-card); text-align: center; animation: fade-in 300ms ease; }.stars { margin-bottom: 20px; color: #e3a629; font-size: clamp(3.5rem, 10vw, 5.5rem); letter-spacing: .13em; animation: soft-scale 1.5s ease-in-out infinite; }.finish h1 { font-size: clamp(2.35rem, 5vw, 4rem); letter-spacing: -.05em; }.finish-actions { display: flex; justify-content: center; gap: 14px; margin-top: 32px; }
.teacher-overlay { position: fixed; z-index: 10; inset: 0; background: rgba(26,39,41,.3); }.teacher-drawer { position: absolute; top: 0; right: 0; width: min(365px, 92vw); min-height: 100%; padding: 28px; background: #263238; color: #fff; box-shadow: -16px 0 36px rgba(0,0,0,.17); animation: drawer-in 220ms ease; }.teacher-drawer h2 { margin-bottom: 5px; }.teacher-meta { color: #c4d0d2; font-size: .9rem; }.teacher-note { margin: 18px 0 -4px; padding: 14px; border-radius: 13px; background: #34484c; color: #e8f1f2; }.teacher-note h3 { margin-bottom: 6px; font-size: .86rem; text-transform: uppercase; letter-spacing: .08em; }.teacher-note p { margin: 0 0 8px; font-size: .88rem; line-height: 1.45; }.teacher-note p:last-child { margin-bottom: 0; }.teacher-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; margin-top: 20px; }.teacher-action { min-height: 51px; padding: 10px; border-radius: 12px; background: #415357; color: #fff; font-weight: 800; }.teacher-action.primary { background: var(--accent); }.teacher-action.success { background: var(--success); }.teacher-action.wide { grid-column: span 2; }.drawer-close { position: absolute; top: 15px; right: 14px; min-width: 48px; min-height: 48px; border-radius: 50%; background: transparent; color: #fff; font-size: 1.7rem; }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } } @keyframes soft-scale { 50% { transform: scale(1.055); } } @keyframes drawer-in { from { transform: translateX(100%); } to { transform: translateX(0); } }
@media (max-width: 620px) { .nav-button { min-width: 109px; padding: 10px; }.nav-button span { display: none; } }

/* Compact progress bar exists alongside desktop dots; it becomes the mobile progress UI. */
.progress { flex: 0 0 auto; }
.progress-bar { display: none; width: 54px; height: 8px; overflow: hidden; border-radius: 999px; background: #e8dfd3; }
.progress-bar-fill { display: block; height: 100%; border-radius: inherit; background: var(--primary); }

@media (max-width: 600px) {
  .icon-button, .nav-button, .replay-button {
    min-width: 54px;
    min-height: 54px;
    border-radius: 15px;

  }
  .topbar > .icon-button { flex: 0 0 54px; padding: 10px; font-size: 1.35rem; }

  }

  .activity-heading {

  }

  .teaching-visual--hero.character {

  .finish { min-height: 100vh; min-height: 100dvh; padding: calc(22px + env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) calc(22px + env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left)); }
  .teacher-drawer { padding: calc(24px + env(safe-area-inset-top)) max(22px, env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) 22px; overflow-y: auto; }
}

@media (max-width: 430px) and (orientation: portrait) {

/* Activity-specific mobile layouts. Teaching images stay large and stable;
   compact concepts use grids instead of long single-column lists. */
@media (max-width: 600px) {
  button, .choice { touch-action: manipulation; }

  .activity-card--learn { padding-top: 18px; padding-bottom: 22px; }
  .activity-card--learn .activity-heading { margin-bottom: 16px; }
  .activity-card--learn .teaching-visual--hero.character {
    width: min(272px, 76vw);
    max-height: 40dvh;
    margin-bottom: 18px;
  }
  .activity-card--learn .learn-replay {
    width: min(250px, 100%);
    min-height: 58px;
    margin: 0 auto;

  }

  .activity-card--listen-choice,
  .activity-card--tap-choice { padding-top: 18px; }
  .activity-card--listen-choice .activity-heading,
  .activity-card--tap-choice .activity-heading { margin-bottom: 14px; }

  .listen-orb {

  }

    margin-bottom: 2px;
  }

    max-width: 100%;
    gap: 10px;
    margin-top: 16px;
  }
  .choice-grid--count-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .choice-grid--count-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .choice-grid--count-3.choice-grid--compact { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .choice-grid--count-3:not(.choice-grid--compact) .choice:last-child:nth-child(odd) {
    grid-column: 1 / -1;
    width: calc((100% - 10px) / 2);
    justify-self: center;
  }
  .choice-grid--count-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .choice-grid--count-5,
  .choice-grid--count-6 { grid-template-columns: repeat(3, minmax(0, 1fr)); }

  .choice {
    min-width: 0;
    min-height: 0;
    flex-direction: column;
    justify-content: center;
    gap: 8px;
    padding: 10px 8px;
    border-width: 2px;
    border-radius: 18px;
    line-height: 1.15;
    -webkit-tap-highlight-color: transparent;
  }
  .choice-grid--count-2 .choice { min-height: 174px; }
  .choice-grid--count-3 .choice { min-height: 154px; }
  .choice-grid--count-3.choice-grid--compact .choice,
  .choice-grid--count-5 .choice,
  .choice-grid--count-6 .choice { min-height: 116px; }

  try {
    const stored = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
    const positions = { ...(stored.lessonPositions || {}) };
    if (Number.isInteger(stored.currentActivity) && !Number.isInteger(positions[stored.currentLesson || "hello"])) positions[stored.currentLesson || "hello"] = stored.currentActivity;

function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

const teachingAudioRegistry = new Map(
  lesson01Entries.map(([text, file]) => [
    normalizeAudioText(text),
    LESSON_01_BASE + file,
  ])
);

function resolveTeachingAudio(text) {
  if (!text) return null;
  return teachingAudioRegistry.get(normalizeAudioText(text)) ?? null;
}

function hasTeachingAudio(text) {
  return Boolean(resolveTeachingAudio(text));
}




let currentAudio = null;

function stopCurrentPlayback() {
  window.speechSynthesis?.cancel();
  if (currentAudio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
    currentAudio = null;
  }
}

function browserTtsFallback(text) {
  if (!state.soundOn || !text || !("speechSynthesis" in window)) return;
  console.warn("[Teaching audio fallback] Browser TTS used for:", text);
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "en-GB";
  utterance.rate = 0.78;
  utterance.pitch = 1.0;
  window.speechSynthesis.speak(utterance);
}

function playText(text, explicitSrc = null) {
  if (!state.soundOn || !text) return;

  stopCurrentPlayback();

  const audioSrc = explicitSrc || resolveTeachingAudio(text);
  if (!audioSrc) {
    browserTtsFallback(text);
    return;
  }

  currentAudio = new Audio(audioSrc);
  currentAudio.preload = "auto";

  currentAudio.play().catch((error) => {
    console.error("[Teaching audio failed]", audioSrc, error);
    browserTtsFallback(text);
  });
}

function replay(activity) {
  if (!state.soundOn || !activity) return;
  const text = activity.ttsText || activity.title;
  playText(text, activity.audioSrc || null);
}

function speak(text) {
  // Backward-compatible API. Existing callers now use fixed teaching audio
  // whenever the text exists in the registry.
  playText(text);
}

function toggleSound() {
  patch({ soundOn: !state.soundOn });
  if (!state.soundOn) stopCurrentPlayback();
  return state.soundOn;
}

function successSound() {
  if (!state.soundOn || !window.AudioContext) return;
  const context = new AudioContext();
  const oscillator = context.createOscillator();
  const gain = context.createGain();
  oscillator.frequency.setValueAtTime(523, context.currentTime);
  oscillator.frequency.exponentialRampToValueAtTime(783, context.currentTime + .16);
  gain.gain.setValueAtTime(.045, context.currentTime);
  gain.gain.exponentialRampToValueAtTime(.001, context.currentTime + .28);
  oscillator.connect(gain).connect(context.destination);
  oscillator.start();
  oscillator.stop(context.currentTime + .29);
}

const getVisual = (visualId) => visuals[visualId];



/** Renders approved teaching artwork. UI symbols intentionally do not use this function. */
function renderVisual(visualId, { className = "", size = "medium", decorative = false } = {}) {
  const visual = getVisual(visualId);
  if (!visual) return unavailableVisual(visualId, "Missing visual asset");
  if (!visual.src || !visual.type || !visual.alt || !visual.concept || visual.approved !== true) {
    console.error(`Invalid teaching visual: ${visualId}`, visual);
    return unavailableVisual(visualId, "Invalid visual asset");
  }

  const image = document.createElement("img");
  image.className = `teaching-visual teaching-visual--${size} ${className}`.trim();
  image.src = visual.src;
  image.alt = decorative ? "" : visual.alt;
  image.loading = "eager";
  image.decoding = "async";
  if (decorative) image.setAttribute("aria-hidden", "true");
  else image.setAttribute("aria-label", visual.alt);
  image.addEventListener("error", () => {
    console.error(`Missing visual asset: ${visualId} (${visual.src})`);
    image.replaceWith(unavailableVisual(visualId, "Image unavailable"));
  }, { once: true });
  return image;
}

function unavailableVisual(visualId, message) {
  console.error(`${message}: ${visualId}`);
  const unavailable = document.createElement("div");
  unavailable.className = "teaching-visual teaching-visual--unavailable";
  unavailable.setAttribute("role", "img");
  unavailable.setAttribute("aria-label", `Image unavailable for ${visualId}`);
  unavailable.textContent = "Image unavailable";
  return unavailable;
}



const NESTED_VISUAL_FIELDS = new Set(["options", "items"]);

function validateLesson(lesson, { strict = false } = {}) {
  const issues = [];
  if (!lesson?.id || !Array.isArray(lesson.activities)) issues.push("Lesson requires an id and activities array.");
  lesson?.activities?.forEach((activity) => validateActivity(activity, issues, `lesson ${lesson.id}`));
  issues.forEach((issue) => strict ? console.error(`[Lesson validation] ${issue}`) : console.warn(`[Lesson validation] ${issue}`));
  return issues;
}

function validateLessons(lessons, options) { return lessons.flatMap((lesson) => validateLesson(lesson, options)); }

function validateActivity(activity, issues, location) {
  if (!activity?.id || !activity?.type) { issues.push(`${location}: activity requires id and type.`); return; }
  validateVisualReference(activity.visualId, issues, `${location}/${activity.id}`);
  for (const field of NESTED_VISUAL_FIELDS) activity[field]?.forEach((item) => validateVisualReference(item.visualId, issues, `${location}/${activity.id}/${field}`));
  validateVisualReference(activity.draggable?.visualId, issues, `${location}/${activity.id}/draggable`);
  validateVisualReference(activity.target?.visualId, issues, `${location}/${activity.id}/target`);
  if (["learn", "speakPrompt", "actionPrompt", "writingPrompt"].includes(activity.type)) requireVisual(activity.visualId, issues, `${location}/${activity.id}`);
  if (["tapChoice", "listenChoose"].includes(activity.type)) activity.options?.forEach((item) => requireVisual(item.visualId, issues, `${location}/${activity.id}/options`));
  if (activity.type === "review") activity.items?.forEach((item) => requireVisual(item.visualId, issues, `${location}/${activity.id}/items`));
  if (activity.type === "dragDrop") { requireVisual(activity.draggable?.visualId, issues, `${location}/${activity.id}/draggable`); requireVisual(activity.target?.visualId, issues, `${location}/${activity.id}/target`); }
  if (activity.type === "challenge") activity.items?.forEach((item) => validateActivity(item, issues, `${location}/${activity.id}/challenge`));
}

function requireVisual(visualId, issues, location) { if (!visualId) issues.push(`${location}: formal teaching activity requires a visualId.`); }

function validateVisualReference(visualId, issues, location) {
  if (!visualId) return;
  const visual = getVisual(visualId);
  if (!visual) { issues.push(`${location}: visualId "${visualId}" does not exist.`); return; }
  for (const field of ["id", "concept", "alt", "src", "type"]) if (!visual[field]) issues.push(`${location}: visual "${visualId}" is missing ${field}.`);
  if (visual.approved !== true) issues.push(`${location}: visual "${visualId}" is not approved.`);
}

function lessonCard(lesson, onOpen, completed = false) {
  const card = document.createElement("button"); card.type = "button"; card.className = `lesson-card ${lesson.locked ? "locked" : ""} ${completed ? "completed" : ""}`; card.disabled = Boolean(lesson.locked);
  card.innerHTML = `<span class="lesson-icon" aria-hidden="true">${lesson.icon}</span><span><span class="lesson-label">Lesson ${lesson.lessonNumber}</span><span class="lesson-name">${lesson.title}</span></span><span class="status">${lesson.locked ? "Locked" : completed ? "Completed" : "Ready"}</span>`;
  if (!lesson.locked) card.addEventListener("click", onOpen); return card;
}



function progress(lesson) {
  const done = lesson.activities.filter((activity) => activityDone(lesson.id, activity.id)).length;
  const total = lesson.activities.length;
  const percent = total ? Math.round((done / total) * 100) : 0;
  const wrap = document.createElement("div"); wrap.className = "progress"; wrap.setAttribute("aria-label", `${done} of ${total} complete`);
  wrap.innerHTML = `<span class="sr-only">${done} of ${total} complete</span><div class="progress-dots">${lesson.activities.map((_, index) => `<span class="progress-dot ${index < done ? "done" : ""}"></span>`).join("")}</div><div class="progress-bar" aria-hidden="true"><span class="progress-bar-fill" style="width:${percent}%"></span></div>`;
  return wrap;
}



function feedbackLine() { const line = document.createElement("p"); line.className = "feedback"; line.setAttribute("aria-live", "assertive"); return line; }
function correct(card, button, feedback, onDone, text = "Great!") { button.classList.add("correct"); feedback.className = "feedback correct"; feedback.textContent = text; successSound(); window.setTimeout(onDone, 620); }
function incorrect(button, feedback, replayText) { button.classList.add("incorrect"); feedback.className = "feedback incorrect"; feedback.textContent = "Try again."; window.setTimeout(() => button.classList.remove("incorrect"), 390); window.setTimeout(() => playText(replayText), 430); }





function openTeacherPanel({ lesson, activity, onPrevious, onNext, onMarkCorrect, onTryAgain, onClose, onHome }) {
  document.querySelector(".teacher-overlay")?.remove();
  const overlay = document.createElement("div"); overlay.className = "teacher-overlay";
  const position = state.lessonPositions[lesson.id] ?? 0;
  const note = activity.teacherNote ? `<section class="teacher-note"><h3>Teacher note</h3><p>${activity.teacherNote}</p>${activity.teacherChecks ? `<p><strong>Observe:</strong> ${activity.teacherChecks}</p>` : ""}</section>` : "";
  overlay.innerHTML = `<aside class="teacher-drawer" role="dialog" aria-modal="true" aria-label="Teacher controls"><button class="drawer-close" type="button" aria-label="Close teacher controls">×</button><h2>Teacher controls</h2><p class="teacher-meta">Current Activity: ${position + 1} — ${activity.type}</p>${note}<div class="teacher-grid"><button class="teacher-action" data-action="previous">Previous</button><button class="teacher-action" data-action="next">Next</button><button class="teacher-action" data-action="replay">Replay</button><button class="teacher-action" data-action="sound">Sound ${state.soundOn ? "On" : "Off"}</button><button class="teacher-action success" data-action="correct">Mark Correct</button><button class="teacher-action primary" data-action="again">Try Again</button><button class="teacher-action wide" data-action="reset-lesson">Reset Lesson</button><button class="teacher-action wide" data-action="reset-all">Reset All Progress</button></div></aside>`;
  const close = () => { overlay.remove(); onClose?.(); };
  overlay.addEventListener("click", (event) => { if (event.target === overlay) close(); });
  overlay.querySelector(".drawer-close").addEventListener("click", close);
  overlay.querySelector(".teacher-grid").addEventListener("click", (event) => {
    const action = event.target.dataset.action; if (!action) return;
    if (action === "previous") { close(); onPrevious(); }
    if (action === "next") { close(); onNext(); }
    if (action === "replay") replay(activity);
    if (action === "sound") { toggleSound(); openTeacherPanel({ lesson, activity, onPrevious, onNext, onMarkCorrect, onTryAgain, onClose, onHome }); }
    if (action === "correct") { close(); onMarkCorrect(); }
    if (action === "again") { close(); onTryAgain(); }
    if (action === "reset-lesson") { resetLesson(lesson.id); close(); onHome(); }
    if (action === "reset-all") { resetAll(); close(); onHome(); }
  });
}

function textElement(tag, className, value) {
  const element = document.createElement(tag);
  element.className = className;
  element.textContent = value;
  return element;
}





function choiceButton(option, { showLabel = true } = {}) {
  const button = document.createElement("button");
  button.type = "button";
  button.className = `choice ${showLabel ? "choice--labelled" : "choice--visual-only"}`;
  button.append(renderVisual(option.visualId, { className: "choice-visual", size: "choice", decorative: false }));
  if (showLabel) {
    const label = document.createElement("span");
    label.className = "choice-label";
    label.textContent = option.label;
    button.append(label);
  }
  button.setAttribute("aria-label", option.label);
  return button;
}


function compactChoiceSet(options = []) {
  const compactIds = new Set(["ball", "table", "chair", "apple", "box"]);
  return options.length > 0 && options.every((option) =>
    /^(colour|numeral|letter)-/.test(option.visualId || "") || compactIds.has(option.visualId)
  );
}

function renderTapChoice(stage, activity, api) {
  const card = document.createElement("section");
  card.className = "activity-card activity-card--tap-choice";
  card.innerHTML = `<p class="activity-type">Play</p><h1 class="activity-heading">${activity.title}</h1>`;

  const grid = document.createElement("div");
  grid.className = `choice-grid choice-grid--tap choice-grid--count-${activity.options.length}${compactChoiceSet(activity.options) ? " choice-grid--compact" : ""}`;
  const feedback = feedbackLine();
  activity.options.forEach((option) => {
    const button = choiceButton(option, { showLabel: activity.showLabels !== false });
    button.addEventListener("click", () => {
      if (option.id === activity.correctAnswer) {
        grid.querySelectorAll("button").forEach((item) => item.disabled = true);
        correct(card, button, feedback, api.complete, "Great!");
      } else {
        incorrect(button, feedback, activity.ttsText);
      }

    grid.append(button);
  });

  const listen = document.createElement("button");
  listen.type = "button";
  listen.className = "replay-button choice-replay";
  listen.innerHTML = '<span class="speaker" aria-hidden="true">🔊</span> Listen';
  listen.addEventListener("click", () => replay(activity));
  card.append(listen, grid, feedback);
  stage.append(card);
}

function renderDragDrop(stage, activity, api) {
  const card = document.createElement("section"); card.className = "activity-card activity-card--drag";
  const type = document.createElement("p"); type.className = "activity-type"; type.textContent = activity.activityLabel || "Play";
  const title = document.createElement("h1"); title.className = "activity-heading"; title.textContent = activity.title;
  card.append(type, title);
  const replayButton = document.createElement("button"); replayButton.type = "button"; replayButton.className = "replay-button"; replayButton.innerHTML = '<span class="speaker">🔊</span> Listen'; replayButton.addEventListener("click", () => replay(activity));
  const draggable = document.createElement("div"); draggable.className = "drag-object"; draggable.append(renderVisual(activity.draggable.visualId, { size: "drag", decorative: true })); draggable.setAttribute("role", "button"); draggable.tabIndex = 0; draggable.setAttribute("aria-label", `Drag ${activity.draggable.label} to ${activity.target.label}`);
  const target = document.createElement("div"); target.className = "drop-target";
  const targetLabel = document.createElement("span"); targetLabel.className = "target-label"; targetLabel.textContent = activity.target.label;
  target.append(targetLabel, renderVisual(activity.target.visualId, { className: "target-visual", size: "target", decorative: true })); target.setAttribute("aria-label", `Drop ${activity.draggable.label} on ${activity.target.label}`);
  const feedback = feedbackLine(); let origin = null; let placed = false;
  const restore = () => { draggable.style.cssText = ""; draggable.className = "drag-object"; };
  const drop = (x, y) => { const box = target.getBoundingClientRect(); if (x >= box.left && x <= box.right && y >= box.top && y <= box.bottom) { placed = true; draggable.style.display = "none"; const placedVisual = renderVisual(activity.draggable.visualId, { className: "placed-visual", size: "placed", decorative: true }); target.append(placedVisual); correct(card, target, feedback, api.complete, "Great!"); } else { restore(); feedback.className = "feedback incorrect"; feedback.textContent = "Try again."; window.setTimeout(() => feedback.textContent = "", 650); } };
  draggable.addEventListener("pointerdown", (event) => { if (placed) return; origin = { x: event.clientX, y: event.clientY }; draggable.setPointerCapture(event.pointerId); draggable.style.position = "fixed"; draggable.style.zIndex = "5"; draggable.style.pointerEvents = "none"; });
  draggable.addEventListener("pointermove", (event) => { if (!origin || placed) return; draggable.style.left = `${event.clientX - 59}px`; draggable.style.top = `${event.clientY - 59}px`; target.classList.toggle("over", document.elementFromPoint(event.clientX, event.clientY)?.closest(".drop-target") === target); });
  draggable.addEventListener("pointerup", (event) => { if (!origin || placed) return; origin = null; target.classList.remove("over"); drop(event.clientX, event.clientY); });
  draggable.addEventListener("keydown", (event) => { if (event.key === "Enter" || event.key === " ") { event.preventDefault(); const rect = target.getBoundingClientRect(); drop(rect.left + rect.width / 2, rect.top + rect.height / 2); } });
  card.append(replayButton, draggable, target, feedback); stage.append(card);
}

  const prompt = document.createElement("p"); prompt.className = "speak-question"; prompt.textContent = activity.prompt;
  card.append(type, renderVisual(activity.visualId, { className: "character", size: "hero" }), title, turn, prompt);
  const button = document.createElement("button"); button.type = "button"; button.className = "replay-button"; button.innerHTML = '<span class="speaker">🔊</span> Replay'; button.addEventListener("click", () => replay(activity));
  const complete = document.createElement("button"); complete.type = "button"; complete.className = "replay-button speak-complete"; complete.textContent = activity.completeLabel || "I said it!"; complete.addEventListener("click", api.complete);
  const actions = document.createElement("div"); actions.className = "activity-actions speak-actions"; actions.append(button, complete); card.append(actions); stage.append(card);
}




// The child acts away from the screen; the teacher observes before completion.
function renderActionPrompt(stage, activity, api) {
  const card = document.createElement("section"); card.className = "activity-card action-card activity-card--action";
  const type = document.createElement("p"); type.className = "activity-type"; type.textContent = activity.activityLabel || "Listen and do";
  const title = document.createElement("h1"); title.className = "activity-heading"; title.textContent = activity.title || "Listen and do.";
  const prompt = document.createElement("p"); prompt.className = "action-prompt"; prompt.textContent = activity.childPrompt || "Listen. Then do it!";
  const visual = renderVisual(activity.visualId, { className: "character", size: "hero" });
  const play = document.createElement("button"); play.type = "button"; play.className = "replay-button"; play.innerHTML = '<span class="speaker">🔊</span> Listen again'; play.addEventListener("click", () => replay(activity));
  const complete = document.createElement("button"); complete.type = "button"; complete.className = "replay-button action-complete"; complete.textContent = activity.completeLabel || "I did it!"; complete.addEventListener("click", api.complete);
  const actions = document.createElement("div"); actions.className = "activity-actions action-actions"; actions.append(play, complete);
  card.append(type, title, visual, prompt, actions); stage.append(card);
}




// Writing is performed on paper, not simulated with an imprecise screen trace.
function renderWritingPrompt(stage, activity, api) {
  const card = document.createElement("section"); card.className = "activity-card writing-card activity-card--writing";
  const type = document.createElement("p"); type.className = "activity-type"; type.textContent = "Paper time";
  const title = document.createElement("h1"); title.className = "activity-heading"; title.textContent = activity.title;
  const visual = renderVisual(activity.visualId, { className: "character", size: "hero" });
  const prompt = document.createElement("p"); prompt.className = "instruction"; prompt.textContent = activity.childPrompt || "Use your paper and pencil.";
  const play = document.createElement("button"); play.type = "button"; play.className = "replay-button"; play.innerHTML = '<span class="speaker">🔊</span> Listen again'; play.addEventListener("click", () => replay(activity));
  const complete = document.createElement("button"); complete.type = "button"; complete.className = "replay-button action-complete"; complete.textContent = activity.completeLabel || "I finished!"; complete.addEventListener("click", api.complete);
  const actions = document.createElement("div"); actions.className = "activity-actions writing-actions"; actions.append(play, complete);
  card.append(type, title, visual, prompt, actions); stage.append(card);
}




function renderReview(stage, activity, api) {
  const card = document.createElement("section"); card.className = "activity-card activity-card--review"; card.innerHTML = `<p class="activity-type">Review</p><h1 class="activity-heading">${activity.title}</h1>`;
  const list = document.createElement("div"); list.className = "review-list"; let count = 0;
  activity.items.forEach((item) => { const button = document.createElement("button"); button.type = "button"; button.className = "review-item"; button.append(renderVisual(item.visualId, { className: "review-visual", size: "review", decorative: true })); const label = document.createElement("span"); label.textContent = item.text; const icon = document.createElement("span"); icon.setAttribute("aria-hidden", "true"); icon.textContent = "🔊"; button.append(label, icon); button.addEventListener("click", () => { playText(item.ttsText || item.text, item.audioSrc || null); if (!button.classList.contains("done")) { button.classList.add("done"); count += 1; if (count === activity.items.length) api.complete(); } }); list.append(button); }); card.append(list); stage.append(card);
}




// Challenge only sequences activity data; it never owns choice, audio or feedback logic.
function renderChallenge(stage, activity, api) {
  const card = document.createElement("section"); card.className = "activity-card challenge-card activity-card--challenge";
  const type = document.createElement("p"); type.className = "activity-type"; type.textContent = "Challenge";
  const title = document.createElement("h1"); title.className = "activity-heading"; title.textContent = activity.title;
  const count = document.createElement("p"); count.className = "challenge-count";
  const inner = document.createElement("div"); inner.className = "challenge-stage";
  const continueButton = document.createElement("button"); continueButton.type = "button"; continueButton.className = "nav-button next challenge-next"; continueButton.textContent = "Next challenge"; continueButton.hidden = true;
  card.append(type, title, count, inner, continueButton); stage.append(card);
  let index = 0;
  const show = () => {
    const item = activity.items?.[index];
    if (!item) { api.complete(); return; }
    if (item.type === "challenge") { console.error("Challenge cannot contain another challenge.", item); return; }
    count.textContent = `${index + 1} / ${activity.items.length}`;
    continueButton.hidden = true; inner.replaceChildren();
    renderActivity(inner, item, { complete: () => { continueButton.hidden = false; continueButton.focus(); } });
  };
  continueButton.addEventListener("click", () => { index += 1; show(); });
  show();
}











const renderers = {
  learn: renderLearn,
  tapChoice: renderTapChoice,
  listenChoose: renderListenChoose,
  dragDrop: renderDragDrop,
  speakPrompt: renderSpeakPrompt,
  review: renderReview,
  challenge: renderChallenge,
  actionPrompt: renderActionPrompt,
  writingPrompt: renderWritingPrompt
};
function renderActivity(stage, activity, api) {
  const renderer = renderers[activity?.type];
  if (!renderer) {
    const message = `Unknown activity type: ${activity?.type || "(missing)"}`;
    console.error(message, activity);
    const error = document.createElement("p"); error.className = "renderer-error"; error.textContent = message; stage.replaceChildren(error); return;
  }
  renderer(stage, activity, api);
}










const app = document.querySelector("#app");
let page = "home";
let longPress = null;
const lesson = () => getLesson(state.currentLesson);
const activityIndex = () => lessonPosition(state.currentLesson);
const activity = () => lesson().activities[activityIndex()];

function showHome() {
  page = "home"; document.querySelector(".teacher-overlay")?.remove(); app.replaceChildren();
  const home = document.createElement("section"); home.className = "home";
  const brand = document.createElement("h1"); brand.className = "brand"; brand.textContent = "English Adventure";
  const grid = document.createElement("div"); grid.className = "lesson-grid";
  lessons.forEach((item) => grid.append(lessonCard(item, () => { openLesson(item.id); showPlayer(); }, Boolean(state.completedLessons[item.id]))));
  home.append(brand, grid); app.append(home);
}

function showPlayer() {
  page = "player"; const currentLesson = lesson(); const currentActivity = activity();
  if (!currentLesson || !currentActivity) return showHome();
  validateLesson(currentLesson, { strict: true });
  app.replaceChildren(); const player = document.createElement("section"); player.className = "player";
  const header = document.createElement("header"); header.className = "topbar";
  const back = button("←", "Back to lessons", "icon-button");
  const title = document.createElement("div"); title.className = "lesson-title"; title.textContent = currentLesson.title; title.setAttribute("aria-label", "Press and hold for teacher controls");
  header.append(back, title, progress(currentLesson));
  const stage = document.createElement("section"); stage.className = "stage"; stage.setAttribute("aria-label", "Learning activity");
  const footer = document.createElement("footer"); footer.className = "bottom-controls";
  const previous = button("‹", "Previous", "nav-button"); previous.innerHTML = '<span aria-hidden="true">‹</span><span>Previous</span>';
  const replayButton = button("🔊", "Replay audio", "replay-button");
  const next = button("›", "Next", "nav-button next"); next.innerHTML = '<span>Next</span><span aria-hidden="true">›</span>';
  const center = document.createElement("div"); center.className = "bottom-center"; center.append(replayButton); footer.append(previous, center, next); player.append(header, stage, footer); app.append(player);
  const complete = () => { markActivityDone(currentLesson.id, currentActivity.id); next.disabled = false; };
  renderActivity(stage, currentActivity, { complete });
  back.addEventListener("click", showHome); replayButton.addEventListener("click", () => replay(currentActivity)); previous.addEventListener("click", previousActivity); next.addEventListener("click", nextActivity); next.disabled = !activityDone(currentLesson.id, currentActivity.id);
  const openTeacher = () => openTeacherPanel({ lesson: currentLesson, activity: currentActivity, onPrevious: previousActivity, onNext: teacherNext, onMarkCorrect: markCorrect, onTryAgain: showPlayer, onClose: () => {}, onHome: showHome });
  title.addEventListener("pointerdown", () => { longPress = window.setTimeout(openTeacher, 1500); });
  ["pointerup", "pointerleave", "pointercancel"].forEach((event) => title.addEventListener(event, () => window.clearTimeout(longPress)));
}

function nextActivity() {
  const currentLesson = lesson(); const currentActivity = activity();
  if (!activityDone(currentLesson.id, currentActivity.id)) return;
  goNext(false);
}
function previousActivity() { if (activityIndex() === 0) return showHome(); setLessonPosition(state.currentLesson, activityIndex() - 1); showPlayer(); }
function markCorrect() { const currentLesson = lesson(); const currentActivity = activity(); markActivityDone(currentLesson.id, currentActivity.id); showPlayer(); }
function teacherNext() { goNext(true); }
function goNext(force) {
  const currentLesson = lesson(); const currentActivity = activity();
  if (!force && !activityDone(currentLesson.id, currentActivity.id)) return;
  if (activityIndex() >= currentLesson.activities.length - 1) { state.completedLessons[currentLesson.id] = true; patch({}); return showFinish(); }
  setLessonPosition(currentLesson.id, activityIndex() + 1); showPlayer();
}
function showFinish() {
  page = "finish"; document.querySelector(".teacher-overlay")?.remove();
  app.innerHTML = '<section class="finish"><div class="finish-card"><div class="stars" aria-hidden="true">★ ★ ★</div><h1>Great job!</h1><div class="finish-actions"><button class="nav-button" type="button" data-finish="home">Home</button><button class="nav-button next" type="button" data-finish="again">Again</button></div></div></section>';
  app.querySelector('[data-finish="home"]').addEventListener("click", showHome);
  app.querySelector('[data-finish="again"]').addEventListener("click", () => { resetLesson(lesson().id); showPlayer(); });
}
function openTeacherFromShortcut() {
  if (page !== "player") return; const currentLesson = lesson(); const currentActivity = activity();
  openTeacherPanel({ lesson: currentLesson, activity: currentActivity, onPrevious: previousActivity, onNext: teacherNext, onMarkCorrect: markCorrect, onTryAgain: showPlayer, onClose: () => {}, onHome: showHome });
}
function button(text, label, className) { const element = document.createElement("button"); element.type = "button"; element.className = className; element.textContent = text; element.setAttribute("aria-label", label); return element; }





validateLessons(lessons.filter((lesson) => Array.isArray(lesson.activities)), { strict: true });

document.addEventListener("keydown", (event) => {
  if (event.shiftKey && !event.ctrlKey && !event.metaKey && event.key.toLowerCase() === "t") { event.preventDefault(); openTeacherFromShortcut(); }
});
showHome();

})();</script></body>
